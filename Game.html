<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Game Tebak Angka</title>
<style>
body {
    font-family: Arial, sans-serif;
    transition: 0.3s;
}
body.light { background:#fff; color:#000; }
body.dark { background:#121212; color:#fff; }

.container {
    width: 380px;
    margin: 30px auto;
    padding: 20px;
    border-radius: 8px;
    text-align: center;
    background: rgba(0,0,0,0.05);
}
body.dark .container {
    background: rgba(255,255,255,0.08);
}

input, select, button {
    padding: 8px;
    margin: 5px;
    width: 90%;
}

#info.benar {
    color: green;
    animation: pop 0.4s;
}
#info.salah {
    color: red;
    animation: shake 0.4s;
}

@keyframes pop {
    0% { transform: scale(0.8); }
    100% { transform: scale(1); }
}

@keyframes shake {
    0% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    50% { transform: translateX(5px); }
    75% { transform: translateX(-5px); }
    100% { transform: translateX(0); }
}

ol { text-align: left; }
</style>
</head>

<body class="light">
<div class="container">
    <h2>Game Tebak Angka</h2>

    <input type="text" id="nama" placeholder="Nama pemain">

    <select id="mode">
        <option value="easy">Easy</option>
        <option value="hard">Hard</option>
        <option value="hardcore">Hardcore</option>
    </select>

    <button onclick="mulaiGame()">Mulai Game</button>
    <button onclick="gantiMode()">Light / Dark</button>

    <p>Level: <span id="level">1</span></p>
    <p>Skor: <span id="skor">0</span></p>
    <p>Waktu: <span id="waktu">0</span> detik</p>
    <p>Sisa Percobaan: <span id="kesempatan">-</span></p>

    <input type="number" id="tebakan" placeholder="Tebak angka">
    <button onclick="cekTebakan()">Tebak</button>

    <p id="info"></p>

    <h3>Leaderboard</h3>
    <ol id="leaderboard"></ol>
</div>

<script>
let level, skor, maxAngka, kesempatan, angkaRahasia;
let timer, waktu;
let modeGame, namaPemain;

function mulaiGame() {
    namaPemain = document.getElementById("nama").value || "Anonim";
    modeGame = document.getElementById("mode").value;

    level = 1;
    skor = 0;
    waktu = 0;

    if (modeGame === "easy") {
        maxAngka = 10; kesempatan = 5;
    } else if (modeGame === "hard") {
        maxAngka = 20; kesempatan = 3;
    } else {
        maxAngka = 50; kesempatan = 2;
    }

    angkaRahasia = acak();
    updateUI();
    mulaiTimer();
    document.getElementById("info").innerText = "Game dimulai. Fokus.";
}

function mulaiTimer() {
    clearInterval(timer);
    timer = setInterval(() => {
        waktu++;
        document.getElementById("waktu").innerText = waktu;
    }, 1000);
}

function acak() {
    return Math.floor(Math.random() * maxAngka) + 1;
}

function cekTebakan() {
    let t = Number(document.getElementById("tebakan").value);
    let info = document.getElementById("info");
    info.className = "";

    kesempatan--;

    if (t === angkaRahasia) {
        skor += 10 * level;
        level++;
        maxAngka += 5;
        kesempatan += 2;
        angkaRahasia = acak();
        info.innerText = "Benar. Naik level.";
        info.classList.add("benar");
    } else {
        info.innerText = t > angkaRahasia ? "Terlalu besar." : "Terlalu kecil.";
        info.classList.add("salah");
    }

    updateUI();

    if (kesempatan <= 0) {
        gameOver();
    }
}

function gameOver() {
    clearInterval(timer);
    document.getElementById("info").innerText =
        "Game Over. Angkanya " + angkaRahasia;
    simpanLeaderboard();
    tampilkanLeaderboard();
}

function simpanLeaderboard() {
    let data = JSON.parse(localStorage.getItem("leaderboard")) || [];
    data.push({
        nama: namaPemain,
        skor: skor,
        waktu: waktu,
        mode: modeGame
    });
    data.sort((a,b) => b.skor - a.skor);
    data = data.slice(0,5);
    localStorage.setItem("leaderboard", JSON.stringify(data));
}

function tampilkanLeaderboard() {
    let data = JSON.parse(localStorage.getItem("leaderboard")) || [];
    let list = document.getElementById("leaderboard");
    list.innerHTML = "";
    data.forEach(p => {
        let li = document.createElement("li");
        li.innerText =
            p.nama + " | " + p.skor + " pts | " +
            p.waktu + "s | " + p.mode;
        list.appendChild(li);
    });
}

function updateUI() {
    document.getElementById("level").innerText = level;
    document.getElementById("skor").innerText = skor;
    document.getElementById("kesempatan").innerText = kesempatan;
}

function gantiMode() {
    document.body.classList.toggle("dark");
    document.body.classList.toggle("light");
}

tampilkanLeaderboard();
</script>
</body>
</html>
