<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Kalkulator Cerdas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            transition: 0.3s;
        }

        .container {
            width: 320px;
            margin: 60px auto;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        input, select, button {
            margin: 6px;
            padding: 8px;
            width: 90%;
        }

        button {
            cursor: pointer;
        }

        /* Light Mode */
        body.light {
            background-color: #ffffff;
            color: #000000;
        }

        body.light .container {
            background-color: #f2f2f2;
        }

        /* Dark Mode */
        body.dark {
            background-color: #121212;
            color: #ffffff;
        }

        body.dark .container {
            background-color: #1e1e1e;
        }
    </style>
</head>
<body class="light">

<div class="container">
    <h2>Kalkulator Cerdas</h2>

    <button onclick="gantiMode()">Ganti Mode Light / Dark</button>

    <input type="number" id="angka1" placeholder="Angka pertama">
    
    <select id="operator">
        <option value="+">+</option>
        <option value="-">−</option>
        <option value="*">×</option>
        <option value="/">÷</option>
    </select>

    <input type="number" id="angka2" placeholder="Angka kedua">

    <button onclick="hitung()">Hitung</button>

    <p id="hasil"></p>
    <p id="penjelasan"></p>
</div>

<script>
    function gantiMode() {
        document.body.classList.toggle("dark");
        document.body.classList.toggle("light");
    }

    function hitung() {
        let a = Number(document.getElementById("angka1").value);
        let b = Number(document.getElementById("angka2").value);
        let op = document.getElementById("operator").value;

        let hasil = "";
        let penjelasan = "";

        if (op === "+") {
            hasil = a + b;
            penjelasan = "Penjumlahan berarti menggabungkan dua nilai. " +
                         a + " ditambah " + b + " menghasilkan " + hasil + ".";
        } 
        else if (op === "-") {
            hasil = a - b;
            penjelasan = "Pengurangan berarti mengambil sebagian nilai. " +
                         "Dari " + a + " dikurangi " + b + " tersisa " + hasil + ".";
        } 
        else if (op === "*") {
            hasil = a * b;
            penjelasan = "Perkalian adalah penjumlahan berulang. " +
                         a + " dikalikan " + b + " berarti " + a +
                         " dijumlahkan sebanyak " + b + " kali.";
        } 
        else if (op === "/") {
            if (b === 0) {
                hasil = "Error";
                penjelasan = "Pembagian dengan nol tidak didefinisikan dalam matematika.";
            } else {
                hasil = a / b;
                penjelasan = "Pembagian berarti membagi nilai menjadi bagian yang sama besar. " +
                             a + " dibagi " + b + " menghasilkan " + hasil + ".";
            }
        }

        document.getElementById("hasil").innerText = "Hasil: " + hasil;
        document.getElementById("penjelasan").innerText = penjelasan;
    }
</script>

</body>
</html>
